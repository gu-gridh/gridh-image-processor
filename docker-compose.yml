services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: image_processor
      POSTGRES_USER: image_processor
      POSTGRES_PASSWORD: /run/secrets/local_db_password
    secrets:
      - local_db_password

secrets:
  local_db_password:
    file: .secrets/local_db.txt

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: